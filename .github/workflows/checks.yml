name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runbook
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: runbook_desk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U runbook -d runbook_desk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://runbook:ci-only-placeholder@127.0.0.1:5432/runbook_desk_test
      MODEL_CALL_LIMIT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: npm ci && npm test && npm run build
        working-directory: frontend
